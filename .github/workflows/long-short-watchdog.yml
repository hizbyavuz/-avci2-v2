name: Long Short Watchdog

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/long-short-watchdog.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  actions: write

# Do not cancel a queued watchdog with the next scheduled watchdog.
# The heal step is idempotent and exits when Analyst/Live Pool is already active.
jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check analyst freshness and restart if stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" --jq '[.workflow_runs[] | select((.name=="Long Short Analyst V3" or .name=="Long Short Live Pool V3") and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')
          if test "$active" -gt 0; then
            echo "Long/Short chain already active; no restart."
            exit 0
          fi

          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/long-short-analyst.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.name=="Long Short Analyst V3" and .status=="completed" and .conclusion=="success")] | sort_by(.updated_at) | reverse | .[0].updated_at // empty')

          now=$(date -u +%s)
          if test -z "$latest"; then
            echo "No successful analyst run found; restarting."
            gh workflow run long-short-analyst.yml --repo "$GITHUB_REPOSITORY" --ref main
            exit 0
          fi

          last=$(date -u -d "$latest" +%s)
          age=$((now-last))
          echo "Latest successful analyst age: ${age}s"

          if test "$age" -gt 600; then
            echo "Analyst stale for >10m; restarting."
            gh workflow run long-short-analyst.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Analyst fresh; no action."
          fi
