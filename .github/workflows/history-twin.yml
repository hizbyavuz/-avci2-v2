name: Gate History Twin Test

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: read

concurrency:
  group: gate-history-twin
  cancel-in-progress: false

jobs:
  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest base history
        uses: actions/cache/restore@v4
        with:
          path: history_miner.db
          key: history-twin-${{ github.run_id }}
          restore-keys: |
            history-base-
            history-miner-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run matched-pair Twin Test
        env:
          HISTORY_VALIDATION_CUTOFF: "2025-09-01"
          TWIN_PROGRESS_INTERVAL_SEC: "1200"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u history_twin_test.py
      - name: Send Twin Test final summary
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u history_twin_telegram.py

      - name: Save Twin lane state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: history_miner.db
          key: history-twin-${{ github.run_id }}
      - name: Publish Twin checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: history-twin-latest
          path: history_miner.db
          retention-days: 3
