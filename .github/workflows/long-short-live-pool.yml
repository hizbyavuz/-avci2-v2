name: Long Short Live Pool V3.1

# Separate near-live watcher. Reads analyst candidates, never places orders.
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write

concurrency:
  group: long-short-live-pool-v31-final
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Restore Binance state for Telegram cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-binance

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.5

      - name: Compile and test V3 production layer
        run: |
          python -m py_compile long_short_analyst.py long_short_direction_engine.py long_short_v3_core.py long_short_live_pool.py long_short_simple_notify.py long_short_outcome_tracker_v21.py long_short_outcome_prices.py
          python -m json.tool LONG_SHORT_V3_FROZEN_CONFIG.json >/dev/null
          python tests/test_long_short_structure_gate_v2.py
          python tests/test_long_short_trade_only_delivery.py
          python tests/test_long_short_observational_telegram.py
          python -m unittest -v tests.test_long_short_telegram_delivery_integrity tests.test_long_short_delivered_direction_audit
          python tests/test_long_short_live_window_coverage.py
          python tests/test_long_short_v3_core.py
          python tests/test_long_short_direction_engine.py
          python tests/test_long_short_outcome_v21.py
          python tests/test_long_short_outcome_venue_451.py
          python tests/test_long_short_v21_integration.py
          python tests/test_watch_alert_tracking_v21.py
          python tests/test_approaching_alert_v21.py
          python tests/test_long_short_live_levels.py

      - name: Restore latest analyst state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .lsa-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=long-short-v31-analyst-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name long-short-v31-analyst-state --dir .lsa-state
            cp .lsa-state/long_short_v31_analyst.db .
          fi
          test -f long_short_v31_analyst.db

      - name: Restore live-pool state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .live-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=long-short-v31-live-pool-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name long-short-v31-live-pool-state --dir .live-state || true
            test -f .live-state/long_short_v31_live_pool.db && cp .live-state/long_short_v31_live_pool.db .
          fi

      - name: Restore shared Telegram anti-spam state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .notify-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=long-short-v31-notify-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name long-short-v31-notify-state --dir .notify-state || true
            test -f .notify-state/long_short_v31_notify.db && cp .notify-state/long_short_v31_notify.db .
          fi

      - name: Run frozen V3 live pool
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LS_DB: "long_short_v31_analyst.db"
          LS_LIVE_DB: "long_short_v31_live_pool.db"
          LS_SIMPLE_NOTIFY_DB: "long_short_v31_notify.db"
          # Explicit observational messages: APPROACHING/qualified EARLY/CLOSE_CONFIRMED.
          # Frozen TRIGGERED gate, entry, execution, and core decisions stay unchanged.
          # Radar-only messages and old pending messages are suppressed separately.
          LS_TELEGRAM_TRADE_ONLY: "0"
          LS_SIMPLE_NOTIFY_STALE_AFTER: "600"
          LS_TELEGRAM_CLOSED_CANDLE_MAX_AGE_SECONDS: "75"
          LS_TELEGRAM_RUNTIME_NOTICES: "0"
          LS_OUTCOME_TELEGRAM: "0"
          LS_LIVE_FETCH_WORKERS: "6"
          LS_LIVE_POLL_SECONDS: "15"
          LS_LIVE_RUN_SECONDS: "330"
          LS_ALIGN_TO_5M: "1"
          LS_ALIGN_GRACE_SECONDS: "4"
          LS_LIVE_MAX_WATCH: "20"
          LS_LIVE_APPROACH_PCT: "0.25"
          LS_RADAR_MIN_DAY_MOVE_PCT: "5.0"
          LS_STRUCTURE_MIN_VOLUME_MULT: "1.10"
          LS_STRUCTURE_MIN_BODY_RATIO: "0.45"
          LS_STRUCTURE_MAX_REJECTION_WICK: "0.35"
          LS_TELEGRAM_HEALTH_SECONDS: "3600"
          LS_VALIDATION_MIN_SLIPPAGE_BPS_PER_SIDE: "10"
        run: python -u long_short_live_pool.py

      - name: Update V3 real-message outcomes
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LS_LIVE_DB: "long_short_v31_live_pool.db"
          LS_SIMPLE_NOTIFY_DB: "long_short_v31_notify.db"
          LS_VALIDATION_MIN_SLIPPAGE_BPS_PER_SIDE: "10"
          LS_VALIDATION_HUMAN_DELAY_SECONDS: "30"
          LS_WATCH_CONTROL_MAX_EPISODES: "24"
        run: python -u long_short_outcome_tracker_v21.py

      - name: Audit DELIVERED Long/Short directions and price source
        if: always()
        run: |
          python -u long_short_delivered_direction_audit.py \
            --live-db long_short_v31_live_pool.db \
            --analyst-db long_short_v31_analyst.db \
            --out long_short_delivered_direction_audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: long-short-delivered-direction-audit
          path: long_short_delivered_direction_audit.json
          retention-days: 30

      - name: Upload live-pool state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: long-short-v31-live-pool-state
          path: long_short_v31_live_pool.db
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6


      - name: Upload shared Telegram anti-spam state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: long-short-v31-notify-state
          path: long_short_v31_notify.db
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Start next analyst cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" --jq '[.workflow_runs[] | select(.id != (${{ github.run_id }}|tonumber)) | select((.name=="Long Short Analyst V3.1" or .name=="Long Short Live Pool V3.1") and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')
          if test "$active" -gt 0; then
            echo "Another Long/Short cycle is already active; skip duplicate analyst dispatch."
            exit 0
          fi
          gh workflow run long-short-analyst.yml --repo "$GITHUB_REPOSITORY" --ref main
