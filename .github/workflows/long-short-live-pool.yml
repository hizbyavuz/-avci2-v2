name: Long Short Live Pool

# Separate near-live watcher. Reads analyst candidates, never places orders.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write

concurrency:
  group: long-short-live-pool
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Restore Binance state for Telegram cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-binance

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.5

      - name: Compile and test V2.1 production layer
        run: |
          python -m py_compile long_short_live_pool.py long_short_simple_notify.py long_short_outcome_tracker_v21.py
          python -m json.tool LONG_SHORT_STRUCTURE_GATE_V2_1_CONFIG.json >/dev/null
          python tests/test_long_short_structure_gate_v2.py
          python tests/test_long_short_outcome_v21.py
          python tests/test_long_short_v21_integration.py

      - name: Restore latest analyst state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .lsa-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=long-short-analyst-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name long-short-analyst-state --dir .lsa-state
            cp .lsa-state/long_short_analyst.db .
          fi
          test -f long_short_analyst.db

      - name: Restore live-pool state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .live-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=long-short-live-pool-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name long-short-live-pool-state --dir .live-state || true
            test -f .live-state/long_short_live_pool.db && cp .live-state/long_short_live_pool.db .
          fi

      - name: Restore shared Telegram anti-spam state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .notify-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=long-short-simple-notify-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name long-short-simple-notify-state --dir .notify-state || true
            test -f .notify-state/long_short_simple_notify.db && cp .notify-state/long_short_simple_notify.db .
          fi

      - name: Run production continuation live pool
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LS_LIVE_POLL_SECONDS: "15"
          LS_LIVE_RUN_SECONDS: "330"
          LS_ALIGN_TO_5M: "1"
          LS_ALIGN_GRACE_SECONDS: "4"
          LS_LIVE_MAX_WATCH: "12"
          LS_LIVE_APPROACH_PCT: "0.25"
          LS_STRUCTURE_MIN_VOLUME_MULT: "1.10"
          LS_STRUCTURE_MIN_BODY_RATIO: "0.45"
          LS_STRUCTURE_MAX_REJECTION_WICK: "0.35"
          LS_TELEGRAM_HEALTH_SECONDS: "3600"
          LS_VALIDATION_MIN_SLIPPAGE_BPS_PER_SIDE: "10"
        run: python -u long_short_live_pool.py

      - name: Update legacy live-stage validation
        if: always()
        run: python -u long_short_live_validation.py

      - name: Update V2.1 real-message outcomes
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LS_VALIDATION_MIN_SLIPPAGE_BPS_PER_SIDE: "10"
          LS_VALIDATION_HUMAN_DELAY_SECONDS: "30"
        run: python -u long_short_outcome_tracker_v21.py

      - name: Upload live-pool state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: long-short-live-pool-state
          path: long_short_live_pool.db
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6


      - name: Upload shared Telegram anti-spam state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: long-short-simple-notify-state
          path: long_short_simple_notify.db
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Start next analyst cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" --jq '[.workflow_runs[] | select(.id != (${{ github.run_id }}|tonumber)) | select((.name=="Long Short Analyst V1" or .name=="Long Short Live Pool") and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')
          if test "$active" -gt 0; then
            echo "Another Long/Short cycle is already active; skip duplicate analyst dispatch."
            exit 0
          fi
          gh workflow run long-short-analyst.yml --repo "$GITHUB_REPOSITORY" --ref main
