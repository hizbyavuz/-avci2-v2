name: Saatlik Motor isolated tests
on:
  push:
    paths: ['hourly_motor_*.py', 'test_hourly_motor.py', '.github/workflows/hourly-motor-ci.yml']
  pull_request:
    paths: ['hourly_motor_*.py', 'test_hourly_motor.py', '.github/workflows/hourly-motor-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.hourly-motor.txt
      - run: python -m unittest -v test_hourly_motor
