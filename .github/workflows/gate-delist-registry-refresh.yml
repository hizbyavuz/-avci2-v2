name: Gate Official Delist Registry Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "gate_official_delist_import.py"
      - ".github/workflows/gate-delist-registry-refresh.yml"
  schedule:
    - cron: "11 1 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Build official Gate delist registry
        env:
          HISTORY_DB: official_delist_registry.db
          GATE_DELIST_PAGES: "25"
        run: python -u gate_official_delist_import.py
      - name: Upload official registry
        uses: actions/upload-artifact@v4
        with:
          name: gate-official-delist-registry
          path: |
            official_delist_registry.db
            gate_delist_import_report.json
          if-no-files-found: error
          retention-days: 90
