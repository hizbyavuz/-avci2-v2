name: Wave Lab Offline Checks
on:
  pull_request:
    paths:
      - 'long_short_wave_*.py'
      - 'tests/test_long_short_wave_lab.py'
      - '.github/workflows/wave-lab-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify research behavior without network or credentials
        run: |
          python -m py_compile long_short_wave_lab.py long_short_wave_runner.py
          python -m unittest discover -s tests -p 'test_long_short_wave_lab.py' -v
          python -m unittest discover -s tests -p 'test_long_short_v4_research.py' -v
