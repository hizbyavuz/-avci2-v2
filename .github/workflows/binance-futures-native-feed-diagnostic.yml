name: Binance Futures Native Feed Diagnostic
on:
  pull_request:
    paths:
      - 'binance_futures_feed_probe.py'
      - 'tests/test_binance_futures_feed_probe.py'
      - '.github/workflows/binance-futures-native-feed-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  futures-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 websocket-client==1.8.0
      - run: python -m unittest -v tests.test_binance_futures_feed_probe
      - name: Probe ONLY public native Binance Futures data
        run: python -u binance_futures_feed_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binance-futures-native-feed-diagnostic
          path: binance_futures_feed_probe.json
          retention-days: 7
