name: Research Validation CI

on:
  workflow_dispatch:
  push:
    paths:
      - "research_validation_layer.py"
      - "research_edge_hardening.py"
      - "audit_write_only_20260930.py"
      - "new_launch_audit_observer.py"
      - "final_test_hypothesis_20261007.json"
      - "research_gap_audit.py"
      - "institutional_validation_suite.py"
      - "avci_global_stress.py"
      - "institutional_model_registry.py"
      - "institutional_coverage_audit.py"
      - "human_decision_ledger.py"
      - "external_shadow_universe.py"
      - "runner_revival_observer.py"
      - "gate_weighted_discovery.py"
      - "gate_engine_status_v2.py"
      - "tests/test_gate_weighted_discovery.py"
      - "genesis_freeze_manifest.json"
      - "genesis_freeze_guard.py"
      - "compliance_ledger.py"
      - "tests/test_compliance_and_freeze.py"
      - "INDEPENDENT_AUDIT_PACKAGE.md"
      - "correlation_position_overlay.py"
      - "execution_size_curve.py"
      - "institutional_context_observer.py"
      - "institutional_signal_overlay.py"
      - "read_only_execution_collector.py"
      - "historical_timing_proxy.py"
      - "gate_official_delist_import.py"
      - "external_security_corpus_import.py"
      - "research_p0_governance.py"
      - "research_telemetry.py"
      - "binance_research_integrity.py"
      - "gate_research_integrity.py"
      - "history_delist_backfill.py"
      - "research_validation_spec.json"
      - "security_adversarial_corpus.csv"
      - "security_corpus_requirements.json"
      - "security_redteam.py"
      - "external_security_replay.py"
      - "execution_fill_import.py"
      - "avci_global_governance.py"
      - "research_decision_discipline.py"
      - "binance_scanner.py"
      - "scanner.py"
      - "tests/test_research_validation_layer.py"
      - ".github/workflows/research-validation-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install requests

      - name: Compile validation, governance and scanner modules
        run: |
          python -m py_compile \
            research_validation_layer.py \
            research_edge_hardening.py \
            audit_write_only_20260930.py \
            new_launch_audit_observer.py \
            research_gap_audit.py \
            institutional_validation_suite.py \
            avci_global_stress.py \
            institutional_model_registry.py \
            institutional_coverage_audit.py \
            human_decision_ledger.py \
            external_shadow_universe.py \
            runner_revival_observer.py \
            gate_weighted_discovery.py \
            genesis_freeze_guard.py \
            compliance_ledger.py \
            correlation_position_overlay.py \
            execution_size_curve.py \
            institutional_context_observer.py \
            institutional_signal_overlay.py \
            read_only_execution_collector.py \
            historical_timing_proxy.py \
            gate_official_delist_import.py \
            external_security_corpus_import.py \
            research_p0_governance.py \
            research_decision_discipline.py \
            research_telemetry.py \
            avci_global_governance.py \
            execution_fill_import.py \
            security_redteam.py \
            external_security_replay.py \
            history_delist_backfill.py \
            binance_research_integrity.py \
            gate_research_integrity.py \
            binance_scanner.py \
            scanner.py \
            binance_engine_status_v2.py \
            recommendation_followup.py \
            binance_trader_message.py \
            gate_trader_message.py
          python -m json.tool research_validation_spec.json >/dev/null
          python -m json.tool final_test_hypothesis_20261007.json >/dev/null

      - name: Run validation-layer tests
        run: python -m unittest tests.test_research_validation_layer -v
