name: Avci 2 V2 Multi-Chain

# Main Gate Web3 early-signal engine. Research-only; never places orders.
on:
  workflow_dispatch:
  push:
    paths:
      - "scanner.py"
      - "gate_wallet_graph_observer.py"
      - "gate_engine_status.py"
      - ".github/workflows/avci-v2.yml"
  schedule:
    - cron: "8,28,48 * * * *"
permissions:
  contents: read
  actions: write

concurrency:
  group: gate-avci2-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Avci DB
        uses: actions/cache/restore@v4
        with:
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
          key: avci2-db-${{ github.run_id }}
          restore-keys: |
            avci2-db-        

      - name: Restore verified Gate history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-gate

      - name: Restore latest Gate History evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .history-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=history-v5-latest&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name history-v5-latest --dir .history-state
          fi

      - name: Restore latest Gate Twin evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .history-twin
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=history-twin-latest&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name history-twin-latest --dir .history-twin
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run complete regression test suite
        run: python -m unittest discover -s tests -v

      - name: Observe Gate Spot and record separate early movement
        continue-on-error: true
        run: |
          python gate_spot_observer.py
          python gate_spot_watch.py

      - name: Analyze coins rising while BTC falls
        continue-on-error: true
        run: python -u gate_btc_divergence.py

      - name: Observe missed movers, leaders, followers, and silent accumulation
        continue-on-error: true
        run: python -u gate_opportunity_observer.py

      - name: Run Avci 2 V2
        env:
         JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
         HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
         ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
         GOPLUS_ACCESS_TOKEN: ${{ secrets.GOPLUS_ACCESS_TOKEN }}
         X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
        run: python scanner.py

      - name: Build sampled buyer wallet / funding graph
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -u gate_wallet_graph_observer.py

      - name: Build anti-manipulation counter-evidence
        continue-on-error: true
        run: python -u gate_deception_observer.py

      - name: Record fixed post-signal checkpoints
        continue-on-error: true
        run: python -u avci_checkpoints.py gate

      - name: Summarize observational QA
        continue-on-error: true
        run: python -u avci_observation_report.py gate

      - name: Calibrate Gate security confidence against past outcomes
        continue-on-error: true
        run: python -u gate_security_calibration.py

      - name: Evaluate Gate activation mathematics
        continue-on-error: true
        run: python -u gate_activation_math.py

      - name: Qualify Gate live candidates with validation evidence
        continue-on-error: true
        run: python -u gate_signal_qualifier.py

      - name: Send one consolidated Gate Web3 motor message
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HISTORY_DB: .history-state/history_miner.db
          TWIN_DB: .history-twin/history_miner.db
        run: python -u gate_engine_status.py
      - name: Summarize Gate candidates and controls
        if: success()
        run: python gate_research_report.py

      - name: Save Avci DB
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
          key: avci2-db-${{ github.run_id }}
      - name: Publish shared signal history
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gate-avci2-signal-history
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
          if-no-files-found: error
          retention-days: 3

      - name: Decide daily archive
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py daily-needed gate >> "$GITHUB_OUTPUT"

      - name: Save independent Gate daily archive
        if: steps.daily.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.daily.outputs.name }}
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
          if-no-files-found: error
          retention-days: 60

      - name: Keep latest two fast Gate backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gate-avci2-signal-history&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[2:] | .[].id')
          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
