name: Avci 2 V2 Multi-Chain

# Main Gate Web3 early-signal engine. Research-only; never places orders.
on:
  workflow_dispatch:
  push:
    paths:
      - "scanner.py"
      - "gate_wallet_graph_observer.py"
      - "gate_engine_status.py"
      - "gate_engine_status_v2.py"
      - "gate_activation_math.py"
      - "gate_evidence_research.py"
      - "gate_research_integrity.py"
      - "trade_readiness_layer.py"
      - "readiness_shadow_paper.py"
      - "research_p0_governance.py"
      - "research_validation_layer.py"
      - "research_gap_audit.py"
      - "research_decision_discipline.py"
      - "institutional_validation_suite.py"
      - "institutional_signal_overlay.py"
      - "correlation_position_overlay.py"
      - "execution_size_curve.py"
      - "execution_fill_import.py"
      - "execution_fill_observations.csv"
      - "security_redteam.py"
      - "external_security_replay.py"
      - "security_adversarial_corpus.csv"
      - "security_corpus_requirements.json"
      - "research_telemetry.py"
      - "historical_timing_proxy.py"
      - "tests/test_research_validation_layer.py"
      - ".github/workflows/avci-v2.yml"
  schedule:
    - cron: "8,28,48 * * * *"
permissions:
  contents: read
  actions: write

concurrency:
  group: gate-avci2-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Avci DB
        uses: actions/cache/restore@v4
        with:
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
          key: avci2-db-${{ github.run_id }}
          restore-keys: |
            avci2-db-        

      - name: Restore verified Gate history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-gate

      - name: Restore latest Gate History evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .history-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=history-v5-latest&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name history-v5-latest --dir .history-state
          fi

      - name: Restore latest Gate Twin evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .history-twin
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=history-twin-latest&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name history-twin-latest --dir .history-twin
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Restore verified real fill observations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .execution-fill
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=execution-fill-observations&per_page=100"             --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name execution-fill-observations --dir .execution-fill
          fi

      - name: Import real fill observations when available
        continue-on-error: true
        env:
          EXECUTION_FILL_FILE: .execution-fill/execution_fill_observations.csv
        run: python -u execution_fill_import.py

      - name: Run complete regression test suite
        run: python -m unittest discover -s tests -v

      - name: Observe Gate Spot and record separate early movement
        continue-on-error: true
        run: |
          python gate_spot_observer.py
          python gate_spot_watch.py

      - name: Analyze coins rising while BTC falls
        continue-on-error: true
        run: python -u gate_btc_divergence.py

      - name: Observe missed movers, leaders, followers, and silent accumulation
        continue-on-error: true
        run: python -u gate_opportunity_observer.py

      - name: Run Avci 2 V2
        env:
         JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
         HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
         ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
         GOPLUS_ACCESS_TOKEN: ${{ secrets.GOPLUS_ACCESS_TOKEN }}
         X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
        run: python scanner.py

      - name: Build sampled buyer wallet / funding graph
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -u gate_wallet_graph_observer.py

      - name: Build anti-manipulation counter-evidence
        continue-on-error: true
        run: python -u gate_deception_observer.py

      - name: Record fixed post-signal checkpoints
        continue-on-error: true
        run: python -u avci_checkpoints.py gate

      - name: Summarize observational QA
        continue-on-error: true
        run: python -u avci_observation_report.py gate

      - name: Calibrate Gate security confidence against past outcomes
        continue-on-error: true
        run: python -u gate_security_calibration.py

      - name: Validate Gate research integrity
        continue-on-error: true
        run: python -u gate_research_integrity.py

      - name: Build Gate candidate evidence dossiers
        continue-on-error: true
        run: python -u gate_evidence_research.py

      - name: Evaluate Gate activation mathematics
        continue-on-error: true
        run: python -u gate_activation_math.py


      - name: Run Gate P0 governance audit
        continue-on-error: true
        run: python -u research_p0_governance.py gate

      - name: Run unified Gate research validation
        continue-on-error: true
        run: python -u research_validation_layer.py gate

      - name: Enforce Gate frozen decision discipline
        continue-on-error: true
        run: python -u research_decision_discipline.py gate

      - name: Measure Gate execution size/slippage curve
        continue-on-error: true
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
        run: python -u execution_size_curve.py gate

      - name: Measure Gate candidate correlation and paper size multiplier
        continue-on-error: true
        run: python -u correlation_position_overlay.py gate

      - name: Build Gate institutional signal overlay
        continue-on-error: true
        run: python -u institutional_signal_overlay.py gate

      - name: Run Gate institutional validation diagnostics
        continue-on-error: true
        run: python -u institutional_validation_suite.py gate

      - name: Recover archived Gate timing proxy
        continue-on-error: true
        run: python -u historical_timing_proxy.py gate

      - name: Restore verified adversarial security corpus
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .security-corpus
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=security-adversarial-corpus&per_page=100"             --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name security-adversarial-corpus --dir .security-corpus
          fi

      - name: Replay independent EVM security corpus through frozen gate
        continue-on-error: true
        env:
          SECURITY_CORPUS: .security-corpus/security_adversarial_corpus.csv
          GOPLUS_ACCESS_TOKEN: ${{ secrets.GOPLUS_ACCESS_TOKEN }}
          SECURITY_REPLAY_PER_CLASS: "100"
        run: |
          if test ! -s "$SECURITY_CORPUS"; then
            export SECURITY_CORPUS=security_adversarial_corpus.csv
          fi
          python -u external_security_replay.py

      - name: Run Gate security adversarial validation
        continue-on-error: true
        env:
          SECURITY_CORPUS: .security-corpus/security_adversarial_corpus.csv
        run: |
          if test ! -s "$SECURITY_CORPUS"; then
            export SECURITY_CORPUS=security_adversarial_corpus.csv
          fi
          python -u security_redteam.py

      - name: Audit unresolved Gate research evidence gaps
        continue-on-error: true
        env:
          HISTORY_DB: .history-state/history_miner.db
          SECURITY_CORPUS: .security-corpus/security_adversarial_corpus.csv
        run: |
          if test ! -s "$SECURITY_CORPUS"; then
            export SECURITY_CORPUS=security_adversarial_corpus.csv
          fi
          python -u research_gap_audit.py gate

      - name: Evaluate Gate trade readiness
        continue-on-error: true
        run: python -u trade_readiness_layer.py gate

      - name: Run Gate readiness-qualified shadow paper trades
        continue-on-error: true
        run: python -u readiness_shadow_paper.py gate

      - name: Send one consolidated Gate Web3 motor message
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HISTORY_DB: .history-state/history_miner.db
          TWIN_DB: .history-twin/history_miner.db
        run: python -u gate_engine_status_v2.py
      - name: Record recommendations and send due 72h follow-ups
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u recommendation_followup.py gate

      - name: Summarize Gate candidates and controls
        if: success()
        run: python gate_research_report.py

      - name: Save Avci DB
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
          key: avci2-db-${{ github.run_id }}
      - name: Publish shared signal history
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gate-avci2-signal-history
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
            gate_research_validation.md
            research_gap_status_gate.json
            historical_timing_proxy_gate.json
            security_external_replay_report.json
          if-no-files-found: error
          retention-days: 3

      - name: Decide daily archive
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py daily-needed gate >> "$GITHUB_OUTPUT"

      - name: Save independent Gate daily archive
        if: steps.daily.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.daily.outputs.name }}
          path: |
            avci2.db
            avci_outcomes.db
            avci_validation_v5.db
          if-no-files-found: error
          retention-days: 60

      - name: Keep latest two fast Gate backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gate-avci2-signal-history&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[2:] | .[].id')
          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
