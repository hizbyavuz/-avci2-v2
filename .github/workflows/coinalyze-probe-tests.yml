name: Coinalyze Binance probe tests
on:
  pull_request:
    paths:
      - 'coinalyze_binance_probe.py'
      - 'test_coinalyze_binance_probe.py'
      - '.github/workflows/coinalyze-probe-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5
      - run: python -m unittest -v test_coinalyze_binance_probe
