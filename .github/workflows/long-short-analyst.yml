name: Long Short Analyst V1
# restart-stamp: 2026-10-06-v2-3-1-broad-radar-discovery
# Active paper-trade analyst. Never places orders.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/long-short-analyst.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: long-short-analyst-v1-fast
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Restore Binance state for Telegram cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-binance

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.5 pyturso==0.7.2

      - name: Compile frozen core and V2.1 hardening layer
        run: |
          python -m py_compile long_short_analyst.py long_short_live_pool.py long_short_simple_notify.py long_short_outcome_tracker_v21.py
          python -m json.tool LONG_SHORT_V1_9_FROZEN_CONFIG.json >/dev/null
          python -m json.tool LONG_SHORT_STRUCTURE_GATE_V2_1_CONFIG.json >/dev/null
          python tests/test_long_short_structure_gate_v2.py
          python tests/test_long_short_outcome_v21.py
          python tests/test_long_short_v21_integration.py
          python tests/test_long_short_discovery_v23.py
          python tests/test_watch_alert_tracking_v21.py
          python tests/test_approaching_alert_v21.py

      - name: Restore latest analyst state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .lsa-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=long-short-analyst-state&per_page=100"             --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name long-short-analyst-state --dir .lsa-state || true
            test -f .lsa-state/long_short_analyst.db && cp .lsa-state/long_short_analyst.db .
          fi

      - name: Run deterministic analyst
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LS_MAX_SYMBOLS: "80"
          LS_PRESELECT_MAX: "24"
          LS_PREFILTER_WORKERS: "8"
          LS_DEEP_WORKERS: "8"
          LS_MIN_24H_QUOTE_VOL: "25000000"
          LS_DISCOVERY_MIN_24H_QUOTE_VOL: "8000000"
          LS_STRUCTURE_LEVEL_NEAR_PCT: "0.80"
          LS_STRUCTURE_MIN_ROOM_FLOOR_PCT: "0.90"
          LS_STRUCTURE_MIN_ROOM_COST_MULT: "3.0"
          LS_VALIDATION_MIN_SLIPPAGE_BPS_PER_SIDE: "10"
          LS_STRUCTURE_MIN_NET_T1_R: "1.0"
          LS_STRUCTURE_MIN_VOLUME_MULT: "1.10"
          LS_STRUCTURE_MIN_BODY_RATIO: "0.45"
          LS_STRUCTURE_MAX_REJECTION_WICK: "0.35"
        run: python -u long_short_analyst.py

      # Persist the fresh analyst DB before starting the near-live watcher.
      # This keeps Telegram monitoring independent from the slower validation/sync work.
      - name: Upload analyst state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: long-short-analyst-state
          path: long_short_analyst.db
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Start live pool immediately
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" --jq '[.workflow_runs[] | select(.name=="Long Short Live Pool" and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')
          if test "$active" -gt 0; then
            echo "Live Pool already active; skip duplicate dispatch."
            exit 0
          fi
          gh workflow run long-short-live-pool.yml --repo "$GITHUB_REPOSITORY" --ref main

