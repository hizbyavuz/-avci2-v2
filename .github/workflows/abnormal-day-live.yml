name: Abnormal Day paper live — LOCKED
on:
  workflow_dispatch:
    inputs:
      initialize_state:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: abnormal-day-paper-live
  cancel-in-progress: false
jobs:
  paper:
    if: vars.ABNORMAL_DAY_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.trend-breakout.txt
      - name: Approved paper only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIALIZE: ${{ inputs.initialize_state }}
        run: |
          args=()
          if [ "$INITIALIZE" = "true" ]; then args+=(--init-state); fi
          python -u abnormal_day_live.py --send-telegram "${args[@]}"
