name: Gate Fast Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "18,38,58 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: gate-fast-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Restore latest verified Gate state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-gate

      - name: Restore Gate fast-watch cooldown ledger
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .gate-fast
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gate-fast-watch-ledger&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name gate-fast-watch-ledger --dir .gate-fast
          fi

      - name: Restore latest Gate History evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .history-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=history-v5-latest&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name history-v5-latest --dir .history-state
          fi

      - name: Refresh Gate Spot market snapshot
        continue-on-error: true
        run: python -u gate_spot_observer.py

      - name: Build lightweight Gate Spot early-watch cohort
        continue-on-error: true
        env:
          GATE_FAST_LEDGER: .gate-fast/watch_ledger.json
        run: python -u gate_spot_watch.py

      - name: Refresh missed-mover accountability
        continue-on-error: true
        run: python -u gate_opportunity_observer.py

      - name: Bridge Gate History Miner evidence
        continue-on-error: true
        env:
          HISTORY_DB: .history-state/history_miner.db
        run: python -u gate_history_bridge.py

      - name: Save Gate fast-watch cooldown ledger
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gate-fast-watch-ledger
          path: .gate-fast/watch_ledger.json
          if-no-files-found: ignore
          retention-days: 2
          overwrite: true

      - name: Send consolidated Gate Web3 Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -u gate_trader_message.py
