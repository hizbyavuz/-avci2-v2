name: Stop legacy motors (user request)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trend-breakout-stop-legacy.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const targets = new Set(["avci-daily-followup.yml","avci-global-governance.yml","avci-monthly.yml","avci-three-day-scorecard.yml","avci-v2.yml","avci-watchdog.yml","binance-money-flow.yml","binance-native-um-market-watch.yml","binance_avci2.yml","binance_winner_anatomy.yml","gate-fast-telegram.yml","gate-spot-watch.yml","history-oos-quick.yml","human-decision-ledger.yml","long-short-analyst.yml","long-short-live-pool.yml","long-short-motion-coverage-audit.yml","long-short-smoke-telegram.yml","long-short-v32-shadow.yml","long-short-v4-native-research.yml","long-short-watchdog.yml","new-launch-avci.yml","offline-long-short-audit.yml","telegram-route-diagnostic-once.yml","telegram-smoke-test-once.yml"]);
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {owner,repo,per_page:100});
            for (const w of workflows.filter(w=>targets.has(w.path.split('/').pop()))) {
              await github.rest.actions.disableWorkflow({owner,repo,workflow_id:w.id});
              for (const status of ['queued','in_progress','waiting','pending','requested']) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns,{owner,repo,workflow_id:w.id,status,per_page:100});
                for (const run of runs) {
                  if (run.id !== context.runId) {
                    try { await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id}); }
                    catch(e) { core.warning('Cancellation race: '+run.id+' '+e.status); }
                  }
                }
              }
            }
            const after = await github.paginate(github.rest.actions.listRepoWorkflows,{owner,repo,per_page:100});
            const result = after.filter(w=>targets.has(w.path.split('/').pop())).map(w=>({id:w.id,path:w.path,state:w.state}));
            core.info(JSON.stringify(result,null,2));
            const active = result.filter(w=>w.state==='active');
            if(active.length) core.setFailed('Still active: '+JSON.stringify(active));
            await core.summary.addHeading('Legacy motors stopped').addCodeBlock(JSON.stringify(result,null,2),'json').write();
