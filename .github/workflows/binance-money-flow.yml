name: Binance Early Signal Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "binance_scanner.py"
      - "binance_flow_observer.py"
      - "binance_derivatives_fallback.py"
      - "binance_engine_status.py"
      - "binance_engine_status_v2.py"
      - "binance_activation_math.py"
      - "binance_evidence_research.py"
      - "binance_research_integrity.py"
      - "binance_live_pool.py"
      - "trade_readiness_layer.py"
      - "readiness_shadow_paper.py"
      - "binance_context_research.py"
      - "binance_catalyst_observer.py"
      - "binance_crossvenue_spot.py"
      - "research_p0_governance.py"
      - "research_validation_layer.py"
      - "research_gap_audit.py"
      - "research_decision_discipline.py"
      - "execution_fill_import.py"
      - "execution_fill_observations.csv"
      - "research_telemetry.py"
      - "tests/test_research_validation_layer.py"
      - ".github/workflows/binance-money-flow.yml"
  schedule:
    - cron: "2,22,42 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: binance-early-signal-engine
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore latest Binance research state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-binance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r binance_requirements.txt

      - name: Restore verified real fill observations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .execution-fill
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=execution-fill-observations&per_page=100"             --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name execution-fill-observations --dir .execution-fill
          fi

      - name: Import real fill observations when available
        continue-on-error: true
        env:
          EXECUTION_FILL_FILE: .execution-fill/execution_fill_observations.csv
        run: python -u execution_fill_import.py

      - name: Run permanent regression tests
        run: python -m unittest discover -s tests -v

      - name: Refresh market and derivative features
        run: python -u binance_scanner.py

      - name: Run 15-minute live confirmation pool
        run: python -u binance_live_pool.py

      - name: Confirm live-pool moves on other spot venues
        continue-on-error: true
        run: python -u binance_crossvenue_spot.py

      - name: Observe timestamped public catalysts
        continue-on-error: true
        run: python -u binance_catalyst_observer.py

      - name: Build cross-sectional and trajectory context
        continue-on-error: true
        run: python -u binance_context_research.py

      - name: Record pre-signal market structure
        continue-on-error: true
        run: python -u binance_structure_observer.py

      - name: Observe leaders, followers, missed movers and silent accumulation
        continue-on-error: true
        run: python -u binance_opportunity_observer.py

      - name: Record money-flow observations
        run: python -u binance_flow_observer.py

      - name: Fill missing derivatives with labelled cross-venue proxy
        continue-on-error: true
        run: python -u binance_derivatives_fallback.py

      - name: Build anti-manipulation counter-evidence
        continue-on-error: true
        run: python -u binance_deception_observer.py

      - name: Update research outcomes
        continue-on-error: true
        run: python -u binance_outcome_labeler.py

      - name: Compare current candidates with historical Winner Anatomy
        continue-on-error: true
        run: python -u binance_winner_bridge.py

      - name: Audit validation integrity
        continue-on-error: true
        run: python -u binance_validation_audit.py

      - name: Validate Binance research integrity
        continue-on-error: true
        run: python -u binance_research_integrity.py

      - name: Build Binance candidate evidence dossiers
        continue-on-error: true
        run: python -u binance_evidence_research.py

      - name: Evaluate Binance activation mathematics
        continue-on-error: true
        run: python -u binance_activation_math.py


      - name: Run P0 governance audit
        continue-on-error: true
        run: python -u research_p0_governance.py binance

      - name: Run unified statistical validation
        continue-on-error: true
        run: python -u research_validation_layer.py binance

      - name: Enforce frozen decision discipline
        continue-on-error: true
        run: python -u research_decision_discipline.py binance

      - name: Audit unresolved research evidence gaps
        continue-on-error: true
        run: python -u research_gap_audit.py binance

      - name: Evaluate execution-aware trade readiness
        continue-on-error: true
        run: python -u trade_readiness_layer.py binance

      - name: Run readiness-qualified shadow paper trades
        continue-on-error: true
        run: python -u readiness_shadow_paper.py binance

      - name: Send one consolidated Binance motor message
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u binance_engine_status_v2.py

      - name: Record recommendations and send due 72h follow-ups
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u recommendation_followup.py binance

      - name: Upload research state
        uses: actions/upload-artifact@v4
        with:
          name: binance-avci2-state
          path: |
            binance_avci2.db
            binance_research_validation.md
            research_gap_status_binance.json
          if-no-files-found: error
          retention-days: 21
          compression-level: 6
