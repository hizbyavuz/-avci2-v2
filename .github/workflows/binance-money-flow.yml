name: Binance Early Signal Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "binance_scanner.py"
      - "binance_flow_observer.py"
      - "binance_derivatives_fallback.py"
      - "binance_engine_status.py"
      - "binance_engine_status_v2.py"
      - "binance_activation_math.py"
      - "binance_evidence_research.py"
      - "binance_research_integrity.py"
      - ".github/workflows/binance-money-flow.yml"
  schedule:
    - cron: "2,22,42 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: binance-early-signal-engine
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore latest Binance research state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-binance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r binance_requirements.txt

      - name: Refresh market and derivative features
        run: python -u binance_scanner.py

      - name: Record pre-signal market structure
        continue-on-error: true
        run: python -u binance_structure_observer.py

      - name: Observe leaders, followers, missed movers and silent accumulation
        continue-on-error: true
        run: python -u binance_opportunity_observer.py

      - name: Record money-flow observations
        run: python -u binance_flow_observer.py

      - name: Fill missing derivatives with labelled cross-venue proxy
        continue-on-error: true
        run: python -u binance_derivatives_fallback.py

      - name: Build anti-manipulation counter-evidence
        continue-on-error: true
        run: python -u binance_deception_observer.py

      - name: Update research outcomes
        continue-on-error: true
        run: python -u binance_outcome_labeler.py

      - name: Compare current candidates with historical Winner Anatomy
        continue-on-error: true
        run: python -u binance_winner_bridge.py

      - name: Audit validation integrity
        continue-on-error: true
        run: python -u binance_validation_audit.py

      - name: Validate Binance research integrity
        continue-on-error: true
        run: python -u binance_research_integrity.py

      - name: Build Binance candidate evidence dossiers
        continue-on-error: true
        run: python -u binance_evidence_research.py

      - name: Evaluate Binance activation mathematics
        continue-on-error: true
        run: python -u binance_activation_math.py


      - name: Send one consolidated Binance motor message
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u binance_engine_status_v2.py

      - name: Record recommendations and send due 72h follow-ups
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u recommendation_followup.py binance

      - name: Upload research state
        uses: actions/upload-artifact@v4
        with:
          name: binance-avci2-state
          path: binance_avci2.db
          if-no-files-found: error
          retention-days: 21
          compression-level: 6
