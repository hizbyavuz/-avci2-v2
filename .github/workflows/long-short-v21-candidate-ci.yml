name: Long Short V2.1 Candidate CI

on:
  push:
    branches:
      - "ls-v2-1-hardening-20261006"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: long-short-v21-candidate-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.5 pyturso==0.7.2

      - name: Compile
        run: |
          python -m py_compile             long_short_analyst.py             long_short_live_pool.py             long_short_simple_notify.py             long_short_outcome_tracker_v21.py             long_short_live_validation.py

      - name: Validate configs
        run: |
          python -m json.tool LONG_SHORT_V1_9_FROZEN_CONFIG.json >/dev/null
          python -m json.tool LONG_SHORT_STRUCTURE_GATE_V2_1_CONFIG.json >/dev/null

      - name: Unit tests
        run: |
          python tests/test_long_short_structure_gate_v2.py
          python tests/test_long_short_outcome_v21.py
