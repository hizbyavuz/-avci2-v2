name: Binance Winner Anatomy Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: binance-avci2-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore latest research state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-binance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r binance_requirements.txt

      - name: Run permanent tests
        run: python -m unittest discover -s tests -v

      - name: Run retrospective winner research
        run: |
          python -u binance_winner_anatomy.py \
            | tee binance_winner_anatomy.log

      - name: Build readable report
        run: python binance_report.py

      - name: Build HTML dashboard
        run: python binance_dashboard.py

      - name: Add report to job summary
        run: |
          cat binance_latest_report.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Send Turkish Winner Anatomy Telegram result
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u binance_winner_notify.py

      - name: Upload research state
        uses: actions/upload-artifact@v4
        with:
          name: binance-avci2-state
          path: |
            binance_avci2.db
            binance_latest_report.md
            binance_dashboard.html
            binance_winner_anatomy.log
          if-no-files-found: error
          retention-days: 21

      - name: Decide daily archive
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py daily-needed >> "$GITHUB_OUTPUT"

      - name: Save independent daily archive
        if: steps.daily.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.daily.outputs.name }}
          path: binance_avci2.db
          if-no-files-found: error
          retention-days: 60
          compression-level: 6

      - name: Keep latest two state backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=binance-avci2-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[2:] | .[].id')

          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
