name: New Launch Avci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "new_launch_avci.py"
      - ".github/workflows/new-launch-avci.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: new-launch-avci
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Restore isolated New Launch state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .new-launch-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=new-launch-avci-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name new-launch-avci-state --dir .new-launch-state
          fi

      - name: Run isolated New Launch Avci
        env:
          NEW_LAUNCH_DB: .new-launch-state/new_launch_avci.db
          NEW_LAUNCH_SEND_TELEGRAM: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -u new_launch_avci.py

      - name: Persist isolated New Launch state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-launch-avci-state
          path: .new-launch-state/new_launch_avci.db
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
