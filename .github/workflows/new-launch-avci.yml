name: New Launch Avci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "new_launch_avci.py"
      - "new_launch_audit_observer.py"
      - ".github/workflows/new-launch-avci.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: new-launch-avci
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Restore isolated New Launch state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .new-launch-state
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=new-launch-avci-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if test -n "$run_id"; then
            gh run download "$run_id" --name new-launch-avci-state --dir .new-launch-state
          fi

      - name: Bootstrap Telegram chat id without touching live motors
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if test -n "$CONFIGURED_CHAT_ID"; then
            echo "NEW_LAUNCH_CHAT_ID=$CONFIGURED_CHAT_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          # Read a local copy of the latest Gate state artifact only to reuse
          # the already-known private Telegram chat id. No Gate workflow/state
          # is changed by this step.
          python avci_state_guard.py restore-gate || true
          python - <<'PY'
          import os, sqlite3
          db="avci2.db"
          chat=""
          if os.path.exists(db):
              try:
                  with sqlite3.connect(db) as c:
                      r=c.execute("SELECT value FROM runtime_settings WHERE key='telegram_chat_id'").fetchone()
                      chat=str(r[0]).strip() if r and r[0] else ""
              except Exception:
                  pass
          if chat:
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
                  f.write("NEW_LAUNCH_CHAT_ID="+chat+"\n")
          PY

      - name: Run isolated New Launch Avci
        env:
          NEW_LAUNCH_DB: .new-launch-state/new_launch_avci.db
          NEW_LAUNCH_SEND_TELEGRAM: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -u new_launch_avci.py

      - name: Append write-only audit outcomes
        env:
          NEW_LAUNCH_DB: .new-launch-state/new_launch_avci.db
        run: python -u new_launch_audit_observer.py

      - name: Persist isolated New Launch state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-launch-avci-state
          path: .new-launch-state/new_launch_avci.db
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
