name: Long Short V3.1 Validation Branch CI
on:
  push:
    branches:
      - research/v31-validation-audit-20261008
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - name: Compile observability and frozen production
        run: |
          python -m py_compile long_short_validation_observer_v31.py long_short_live_pool.py long_short_outcome_tracker_v21.py
          python -m json.tool LONG_SHORT_V3_FROZEN_CONFIG.json > /dev/null
      - name: Run observational regression tests
        run: |
          python -m unittest -v tests.test_long_short_validation_observer_v31
          python tests/test_long_short_trade_only_delivery.py
          python tests/test_long_short_v3_core.py
          python tests/test_long_short_direction_engine.py
          python tests/test_long_short_outcome_v21.py
          python tests/test_long_short_v21_integration.py
