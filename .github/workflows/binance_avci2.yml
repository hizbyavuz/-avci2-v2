name: Binance Avci 2

on:
  workflow_dispatch:
    inputs:
      journal_action:
        description: "Optional: ENTRY, EXIT or SKIP"
        required: false
        type: choice
        default: "NONE"
        options: ["NONE", "ENTRY", "EXIT", "SKIP"]
      journal_event_id:
        description: "Signal event ID"
        required: false
        type: string
      journal_price:
        description: "Executed price (0 for SKIP)"
        required: false
        default: "0"
        type: string
      journal_quantity:
        description: "Optional quantity"
        required: false
        type: string
      journal_notes:
        description: "Optional decision note"
        required: false
        type: string

  push:
    paths:
      - "binance_*.py"
      - "tests/test_core.py"
      - ".github/workflows/binance_avci2.yml"

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: binance-avci2-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore latest research state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py restore-binance

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r binance_requirements.txt

      - name: Run permanent tests
        run: python -m unittest discover -s tests -v

      - name: Save optional manual trade journal entry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.journal_action != 'NONE' }}
        env:
          JOURNAL_ACTION: ${{ inputs.journal_action }}
          JOURNAL_EVENT_ID: ${{ inputs.journal_event_id }}
          JOURNAL_PRICE: ${{ inputs.journal_price }}
          JOURNAL_QUANTITY: ${{ inputs.journal_quantity }}
          JOURNAL_NOTES: ${{ inputs.journal_notes }}
        run: |
          args=(
            --event-id "$JOURNAL_EVENT_ID"
            --action "$JOURNAL_ACTION"
            --price "$JOURNAL_PRICE"
            --notes "$JOURNAL_NOTES"
          )

          if [ -n "$JOURNAL_QUANTITY" ]; then
            args+=(--quantity "$JOURNAL_QUANTITY")
          fi

          python binance_trade_journal.py "${args[@]}"

      - name: Run Binance scanner
        run: python -u binance_scanner.py

      - name: Record paper entry and exit observations
        run: python -u binance_trade_signals.py

      - name: Record pre-signal market-structure observations
        continue-on-error: true
        run: python -u binance_structure_observer.py

      - name: Record order-book, trade, and derivative observations
        continue-on-error: true
        run: python -u binance_flow_observer.py

      - name: Retrieve Gate signal history for observational comparison
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gate-avci2-signal-history&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            mkdir -p .gate-state
            gh run download "$run_id" --name gate-avci2-signal-history --dir .gate-state
          fi

      - name: Compare timestamped signals between venues
        run: python -u cross_venue_observer.py

      - name: Run outcome labeler
        run: python -u binance_outcome_labeler.py

      - name: Compare candidates with Winner Anatomy
        run: python -u binance_winner_bridge.py

      - name: Build readable report
        run: python binance_report.py

      - name: Build HTML dashboard
        run: python binance_dashboard.py

      - name: Add report to job summary
        run: cat binance_latest_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send Turkish Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u binance_notify.py

      - name: Upload research state
        uses: actions/upload-artifact@v4
        with:
          name: binance-avci2-state
          path: |
            binance_avci2.db
            binance_latest_report.md
            binance_dashboard.html
          if-no-files-found: error
          retention-days: 21
          compression-level: 6

      - name: Decide daily archive
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avci_state_guard.py daily-needed >> "$GITHUB_OUTPUT"

      - name: Save independent daily archive
        if: steps.daily.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.daily.outputs.name }}
          path: binance_avci2.db
          if-no-files-found: error
          retention-days: 60
          compression-level: 6

      - name: Keep latest two state backups
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=binance-avci2-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[2:] | .[].id')

          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Alert on failed scan or report
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u binance_health_alert.py
