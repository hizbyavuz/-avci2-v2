name: Gate History Miner

on:
  workflow_dispatch:
  push:
    paths:
      - "history_delist_backfill.py"
      - "history_twin_test.py"
      - "history_validation_v5.py"
      - "history_telegram_report.py"
      - ".github/workflows/history-miner.yml"
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"

permissions:
  contents: read

concurrency:
  group: gate-history-miner
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore history state
        uses: actions/cache/restore@v4
        with:
          path: history_miner.db
          key: history-miner-${{ github.run_id }}
          restore-keys: |
            history-miner-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Backfill known delisted and suspended Gate pairs
        continue-on-error: true
        env:
          HISTORY_LOOKBACK_DAYS: "730"
          HISTORY_DELIST_PAIR_BUDGET: "2"
          HISTORY_DELIST_SLEEP: "0.20"
        run: python -u history_delist_backfill.py

      - name: Run matched-pair Twin Test
        env:
          HISTORY_VALIDATION_CUTOFF: "2025-09-01"
        run: python -u history_twin_test.py

      - name: Build V5 activation validation
        env:
          HISTORY_VALIDATION_CUTOFF: "2025-09-01"
          HISTORY_V5_BUDGET: "120"
          HISTORY_V5_SLEEP: "0.15"
        run: python -u history_validation_v5.py

      - name: Send V5 progress summary
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u history_telegram_report.py

      - name: Save history state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: history_miner.db
          key: history-miner-${{ github.run_id }}

      - name: Publish small checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: history-miner-latest
          path: history_miner.db
          retention-days: 3
