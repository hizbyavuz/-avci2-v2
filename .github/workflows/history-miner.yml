name: Gate History Miner

on:
  workflow_dispatch:
  push:
    paths:
      - "history_miner.py"
      - "history_event_miner.py"
      - "HISTORY_MINER.md"
      - "history_telegram_report.py"
      - "history_validation.py"
      - "history_validation_v2.py"
      - ".github/workflows/history-miner.yml"
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"

permissions:
  contents: read

concurrency:
  group: gate-history-miner
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore history state
        uses: actions/cache/restore@v4
        with:
          path: history_miner.db
          key: history-miner-${{ github.run_id }}
          restore-keys: |
            history-miner-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Refresh Gate contract seed
        run: python -u gate_spot_observer.py

      - name: Mine broad historical rise events
        env:
          HISTORY_LOOKBACK_DAYS: "730"
          HISTORY_EVENT_PAIR_BUDGET: "120"
          HISTORY_EVENT_SLEEP: "0.25"
        run: python -u history_event_miner.py

      - name: Mine hourly pre-rise paths
        env:
          HISTORY_PATH_BUDGET: "120"
          HISTORY_PATH_SLEEP: "0.20"
        run: python -u history_hourly_path_miner.py

      - name: Build bias-aware validation layer
        env:
          HISTORY_VALIDATION_CUTOFF: "2025-09-01"
          HISTORY_MATCH_WINDOW_DAYS: "45"
        run: python -u history_validation.py

      - name: Build V2 multi-horizon matched validation
        run: python -u history_validation_v2.py

      - name: Refresh current on-chain snapshots
        env:
          HISTORY_BATCH: "1000"
          HISTORY_SLEEP_SECONDS: "6.2"
          HISTORY_MAX_RUN_SECONDS: "900"
          HISTORY_LOOKBACK_DAYS: "730"
        run: python -u history_miner.py


      - name: Send History Miner research summary
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u history_telegram_report.py

      - name: Save history state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: history_miner.db
          key: history-miner-${{ github.run_id }}

      - name: Publish small checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: history-miner-latest
          path: history_miner.db
          retention-days: 3
