name: Gate History V5

on:
  workflow_dispatch:
  push:
    paths:
      - "history_validation_v5.py"
      - "history_oos_validation.py"
      - "history_telegram_status.py"
      - ".github/workflows/history-miner.yml"
  schedule:
    - cron: "6 * * * *"

permissions:
  contents: read

concurrency:
  group: gate-history-v5
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore history state
        uses: actions/cache/restore@v4
        with:
          path: history_miner.db
          key: history-v5-${{ github.run_id }}
          restore-keys: |
            history-base-
            history-miner-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Build V5 activation validation
        env:
          HISTORY_VALIDATION_CUTOFF: "2025-09-01"
          HISTORY_V5_BUDGET: "120"
          HISTORY_V5_SLEEP: "0.15"
        run: python -u history_validation_v5.py

      - name: Chronological 70/30 blind OOS
        env:
          HISTORY_OOS_FEATURE_BUDGET: "120"
        run: python -u history_oos_validation.py

      - name: Save history state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: history_miner.db
          key: history-v5-${{ github.run_id }}

      - name: Publish small checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: history-v5-latest
          path: |
            history_miner.db
            history_oos_report.json
            history_oos_report.md
          if-no-files-found: warn
          retention-days: 3
