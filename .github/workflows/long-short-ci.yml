name: Long Short CI

on:
  pull_request:
    paths:
      - "long_short_*.py"
      - "test_long_short_*.py"
      - "tests/test_long_short_*.py"
      - ".github/workflows/long-short-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.5

      - name: Compile Long/Short modules
        run: |
          python -m py_compile             long_short_data_router.py             long_short_direction_engine.py             long_short_v3_core.py             long_short_analyst.py             long_short_live_pool.py             long_short_reversal_live.py             long_short_simple_notify.py             long_short_validation.py \
            long_short_live_validation.py long_short_outcome_prices.py long_short_outcome_tracker_v21.py long_short_v32_shadow.py long_short_crowding_shadow.py

      - name: Run Long/Short unit tests
        run: |
          python -m unittest -v test_long_short_data_router.py test_long_short_core.py
          python tests/test_long_short_discovery_v23.py
          python tests/test_long_short_live_levels.py
          python tests/test_long_short_live_window_coverage.py
          python tests/test_long_short_v3_core.py
          python tests/test_long_short_direction_engine.py
          python tests/test_long_short_outcome_v21.py
          python tests/test_long_short_outcome_venue_451.py
          python tests/test_long_short_v21_integration.py
          python -m unittest -v tests.test_long_short_room_v32_shadow tests.test_long_short_v32_room_report
          python tests/test_long_short_trade_only_delivery.py
          python tests/test_long_short_observational_telegram.py
          python -m unittest -v tests.test_long_short_v32_shadow tests.test_long_short_crowding_shadow

      - name: Live public derivatives smoke test
        run: |
          python - <<'PY'
          import json
          import time
          from long_short_data_router import gate_derivatives, multi_venue_derivatives

          last = None
          for attempt in range(3):
              x = multi_venue_derivatives("BTCUSDT")
              print(json.dumps({
                  "quality": x.get("quality"),
                  "coverage": x.get("coverage"),
                  "field_source": x.get("field_source"),
                  "errors": x.get("errors"),
              }, ensure_ascii=False))
              if x.get("quality") == "FULL":
                  break
              last = x
              time.sleep(2)
          else:
              raise SystemExit("Critical derivatives bundle is not FULL: " + repr(last))

          gate = gate_derivatives("BTCUSDT")
          print("GATE", json.dumps({
              "quality": gate.get("quality"),
              "coverage": gate.get("coverage"),
              "field_source": gate.get("field_source"),
              "errors": gate.get("errors"),
          }, ensure_ascii=False))
          if gate.get("quality") != "FULL":
              raise SystemExit("Gate fallback smoke test is not FULL: " + repr(gate))
          PY

      - name: Gate 1m historical price source smoke test
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta,timezone
          from long_short_outcome_prices import historical_1m,has_full_horizon
          end=datetime.now(timezone.utc).replace(second=0,microsecond=0)-timedelta(minutes=3)
          start=end-timedelta(minutes=15)
          data=historical_1m("BTCUSDT",start,end,requested_source="GATE_FUTURES",allow_fallback=False)
          print("GATE_HISTORICAL_PRICE",len(data),data.source,data.venue_matched)
          if data.source!="GATE_FUTURES" or not data.venue_matched or not has_full_horizon(data,start,end):
              raise SystemExit("Gate historical 1m smoke failed")
          PY
