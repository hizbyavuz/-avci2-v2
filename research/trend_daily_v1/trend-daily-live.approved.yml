name: Daily Trend paper live — APPROVED TEMPLATE
# No daily schedule before a passed report and explicit user approval.
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      initialize_state:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: trend-daily-paper-live
  cancel-in-progress: false
jobs:
  paper:
    if: vars.TREND_DAILY_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.trend-breakout.txt
      - name: Daily paper only, verified report and approval required
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INITIALIZE: ${{ inputs.initialize_state }}
        run: |
          args=()
          if [ "$INITIALIZE" = "true" ]; then args+=(--init-state); fi
          python -u trend_daily_live.py --send-telegram "${args[@]}"
